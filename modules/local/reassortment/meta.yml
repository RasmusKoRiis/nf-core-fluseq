# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: reassortment
description: Compare segment consensus sequences with lineage references and summarize potential reassortment.
keywords:
  - influenza
  - reassortment
  - sequence analysis
tools:
  - BLAST+:
      description: Nucleotide similarity searches against reference sequences.
      homepage: https://www.ncbi.nlm.nih.gov/books/NBK279690/
input:
  - - meta:
        type: map
        description: Sample metadata map containing at least the id key.
    - sequences:
        type: file
        description: Influenza segment consensus FASTA files.
  - reassortment_database:
      type: file
      description: Multi-lineage nucleotide reference FASTA for reassortment analysis.
output:
  genotype:
    - - meta:
          type: map
          description: Sample metadata map containing at least the id key.
      - genotype:
          type: file
          description: Genotype or lineage assignment summary.
          pattern: ${meta.id}_reassortment_summary.csv
  genotype_report:
    - genotype_report:
        type: file
        description: Genotype or lineage assignment CSV for reporting.
        pattern: ${meta.id}_reassortment_summary.csv
  versions:
    - versions:
        type: file
        description: Software versions used by this task.
        pattern: versions.yml
authors:
  - "@RasmusKoRiis"
maintainers:
  - "@RasmusKoRiis"
