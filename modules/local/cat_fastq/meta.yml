# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: cat_fastq
description: Concatenate compressed or uncompressed FASTQ inputs into one compressed file per sample.
keywords:
  - influenza
  - cat_fastq
  - sequence analysis
tools:
  - coreutils:
      description: File concatenation and text output utilities.
      homepage: https://www.gnu.org/software/coreutils/
input:
  - - meta:
        type: map
        description: Sample metadata map containing at least the id key.
    - reads:
        type: file
        description: FASTQ files for one sample; compressed and uncompressed inputs are supported.
output:
  reads:
    - - meta:
          type: map
          description: Sample metadata map containing at least the id key.
      - reads:
          type: file
          description: Concatenated gzipped FASTQ reads.
          pattern: "*.merged.fastq.gz"
  versions:
    - versions:
        type: file
        description: Software versions used by this task.
        pattern: versions.yml
authors:
  - "@joseespinosa"
  - "@drpatelh"
  - "@RasmusKoRiis"
maintainers:
  - "@RasmusKoRiis"
