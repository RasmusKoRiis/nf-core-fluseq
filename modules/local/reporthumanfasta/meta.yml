# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: reporthumanfasta
description: Build the human FASTA run report, restoring original sample names and incorporating mutation
  and subclade annotations.
keywords:
  - influenza
  - reporthumanfasta
  - sequence analysis
tools:
  - FluSeq scripts:
      description: Repository-specific influenza analysis and reporting helpers.
      homepage: https://github.com/RasmusKoRiis/nf-core-fluseq
input:
  - subtype:
      type: file
      description: Subtype text file or subtype summary CSV files, as required by this process.
  - coverage:
      type: file
      description: Consensus completeness and quality CSV files.
  - mutation_human:
      type: file
      description: Human influenza mutation reports.
  - mutation_inhibtion:
      type: file
      description: Antiviral inhibition mutation reports (legacy input spelling).
  - lookup:
      type: file
      description: Antiviral inhibition workbook lookup results.
  - nextclade_summary_ha:
      type: file
      description: Nextclade HA summary CSV files.
  - nextclade_sample:
      type: file
      description: Per-sample Nextclade mutation CSV files.
  - mutation_vaccine:
      type: file
      description: Vaccine comparison mutation reports.
  - id_map:
      type: file
      description: TSV mapping SampleID to OriginalName.
  - runid:
      type: string
      description: Run identifier used in report names and metadata.
  - release_version:
      type: string
      description: Pipeline release identifier to include in reports.
  - filtered_fasta:
      type: list
      description: Compatibility input; accepted but not read by this report process.
  - seq_instrument:
      type: string
      description: Sequencing instrument label for report metadata.
  - samplesheet:
      type: string
      description: Compatibility input; accepted but not read by this report process.
  - reassortment_report:
      type: file
      description: Reassortment summary CSV files.
  - subclade_nomenclature_report:
      type: file
      description: Subclade nomenclature and characterisation CSV files.
output:
  report:
    - report:
        type: file
        description: Build the human FASTA run report, restoring original sample names and incorporating
          mutation and subclade annotations. Output CSV.
        pattern: ${runid}.csv
  versions:
    - versions:
        type: file
        description: Software versions used by this task.
        pattern: versions.yml
authors:
  - "@RasmusKoRiis"
maintainers:
  - "@RasmusKoRiis"
