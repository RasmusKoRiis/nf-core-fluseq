name: Infrastructure CI

permissions:
  contents: read

on:
  push:
    branches:
      - dev
      - infrastructure
  pull_request:
  workflow_dispatch:

env:
  NXF_ANSI_LOG: false
  # The workflow still contains dynamic Groovy that is not accepted by the
  # strict parser made default in Nextflow 26.04.
  NXF_SYNTAX_PARSER: v1

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  nextflow-smoke:
    name: Nextflow ${{ matrix.nextflow-version }} smoke tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextflow-version:
          - "24.10.2"
          - "latest-stable"
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3
        with:
          version: "${{ matrix.nextflow-version }}"

      - name: Validate configuration and help
        run: |
          nextflow config . -profile docker,server
          nextflow run . --help

      - name: Validate routine and canonical FASTQ inputs
        working-directory: tests/input_check
        run: |
          nextflow -C nextflow.config run main.nf \
            --input ../data/input_check/routine.csv \
            --samples_dir ../data/input_check/fastq
          nextflow -C nextflow.config run main.nf \
            --input ../data/input_check/explicit.csv

      - name: Validate reference provenance
        working-directory: tests/reference_provenance
        run: >-
          nextflow -C nextflow.config run main.nf
          --references ../data/surveillance_summary

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Run Python tests
        run: python -m pytest -p no:cacheprovider
