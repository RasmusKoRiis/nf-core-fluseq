name: nf-test
permissions:
  contents: read

on:
  push:
    branches:
      - dev
      - infrastructure
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  release:
    types: [published]
  workflow_dispatch:

env:
  NXF_ANSI_LOG: false
  NXF_SYNTAX_PARSER: v1
  NF_TEST_VERSION: "0.9.5"
  NF_TEST_SHA256: "b7679eb90cdc9642bfa89e9634db02ce6e699de53ad35ef0e2f4847634fc1641"

jobs:
  nf-test:
    name: nf-test / Nextflow ${{ matrix.NXF_VER }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - "24.10.2"
          - "latest-stable"
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Install nf-test
        run: |
          curl -fsSLo nf-test.tar.gz "https://github.com/askimed/nf-test/releases/download/v${NF_TEST_VERSION}/nf-test-${NF_TEST_VERSION}.tar.gz"
          echo "${NF_TEST_SHA256}  nf-test.tar.gz" | sha256sum -c -
          tar -xzf nf-test.tar.gz
          mkdir -p "${HOME}/.local/share/nf-test"
          mv nf-test nf-test.jar "${HOME}/.local/share/nf-test/"
          chmod +x "${HOME}/.local/share/nf-test/nf-test"
          echo "${HOME}/.local/share/nf-test" >> "${GITHUB_PATH}"

      - name: Run nf-test component suites
        run: >-
          nf-test test
          tests/modules/local/surveillance_summary.nf.test
          modules/local/cat_fastq/tests/main.nf.test
